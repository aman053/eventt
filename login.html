<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090A0C">
  <meta name="description" content="Sign in to EventEase">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css?v=34">
  <link rel="stylesheet" href="css/liquid-glass.css?v=34">
  <link rel="stylesheet" href="css/obsidian-gold.css?v=41">
  <title>Login — EventEase</title>
</head>
<body class="auth-page auth-focus">
  <main class="auth-focus-shell">
    <section class="auth-focus-card" aria-label="Sign in">
      <!-- Brand header -->
      <header class="auth-focus-brand">
        <span class="brand-mark">E</span>
        <div class="auth-focus-brand-text">
          <strong>EventEase</strong>
          <span>PLAN WITH PURPOSE</span>
        </div>
      </header>

      <hr class="auth-focus-rule" />

      <!-- Welcome -->
      <div class="auth-focus-intro">
        <h1>Welcome back.</h1>
        <p>Your next great event starts here.</p>
      </div>

      <!-- Login form -->
      <form class="auth-focus-form" id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">Email address</label>
          <input id="loginEmail" type="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Enter your password">
        </div>
        <div class="auth-form-meta">
          <a href="#" id="forgotLink" class="auth-text-link">Forgot password?</a>
        </div>
        <button class="btn btn-primary full auth-submit" type="submit">Sign in →</button>
        <p class="form-message" id="loginMessage" role="status"></p>
        <p class="auth-focus-switch">
          New to EventEase?
          <a href="register.html">Create an account</a>
        </p>
      </form>

      <!-- Reset form (same IDs for auth.js) -->
      <form class="auth-focus-form" id="resetForm" hidden>
        <h2 class="auth-reset-title">Reset password</h2>
        <p class="auth-reset-desc">Enter the email and full name you registered with.</p>
        <div class="field">
          <label for="resetEmail">Email</label>
          <input id="resetEmail" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="resetName">Full name</label>
          <input id="resetName" required autocomplete="name">
        </div>
        <div class="field">
          <label for="resetPassword">New password</label>
          <input id="resetPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters">
        </div>
        <button class="btn btn-primary full auth-submit" type="submit">Reset password</button>
        <p class="form-message" id="resetMessage" role="status"></p>
        <p class="auth-focus-switch">
          <a href="#" id="backLogin" class="auth-text-link">← Back to sign in</a>
        </p>
      </form>
    </section>

    <p class="auth-focus-footer">
      <a href="index.html">← Back to home</a>
    </p>
  </main>

  <script src="js/store.js?v=34"></script>
  <script src="js/transitions.js?v=34"></script>
  <script src="js/auth.js?v=34"></script>
  <script src="js/settings.js?v=38"></script>
  <script src="js/i18n.js?v=34"></script>
</body>
</html>
