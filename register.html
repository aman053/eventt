<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090A0C">
  <meta name="description" content="Create your EventEase account">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css?v=34">
  <link rel="stylesheet" href="css/liquid-glass.css?v=34">
  <link rel="stylesheet" href="css/obsidian-gold.css?v=41">
  <title>Create account — EventEase</title>
</head>
<body class="auth-page auth-focus">
  <main class="auth-focus-shell">
    <section class="auth-focus-card" aria-label="Create account">
      <header class="auth-focus-brand">
        <span class="brand-mark">E</span>
        <div class="auth-focus-brand-text">
          <strong>EventEase</strong>
          <span>PLAN WITH PURPOSE</span>
        </div>
      </header>

      <hr class="auth-focus-rule" />

      <div class="auth-focus-intro">
        <h1>Create your account.</h1>
        <p>Start planning your next event in under a minute.</p>
      </div>

      <form class="auth-focus-form" id="registerForm" novalidate>
        <div class="field">
          <label for="registerName">Full name</label>
          <input id="registerName" required autocomplete="name" placeholder="Your name">
        </div>
        <div class="field">
          <label for="registerEmail">Email address</label>
          <input id="registerEmail" type="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters">
        </div>
        <button class="btn btn-primary full auth-submit" type="submit">Create account →</button>
        <p class="form-message" id="registerMessage" role="status"></p>
        <p class="auth-focus-switch">
          Already have an account?
          <a href="login.html">Sign in</a>
        </p>
      </form>
    </section>

    <p class="auth-focus-footer">
      <a href="index.html">← Back to home</a>
    </p>
  </main>

  <script src="js/store.js?v=34"></script>
  <script src="js/transitions.js?v=34"></script>
  <script src="js/auth.js?v=34"></script>
  <script src="js/settings.js?v=38"></script>
  <script src="js/i18n.js?v=34"></script>
</body>
</html>
